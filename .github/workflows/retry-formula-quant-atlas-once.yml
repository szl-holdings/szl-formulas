# SPDX-License-Identifier: Apache-2.0
name: Retry formula quant atlas once

on:
  push:
    branches:
      - feat/formula-quant-atlas-v1-20260904
    paths:
      - .github/workflows/retry-formula-quant-atlas-once.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/formula-quant-atlas-v1-20260904
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"

      - name: Install the exact missing test dependency
        run: python -m pip install --disable-pip-version-check --no-cache-dir "pytest==8.3.5"

      - name: Execute the reviewed materialization body
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path(".github/workflows/materialize-formula-quant-atlas-once.yml").read_text(
              encoding="utf-8"
          )
          start_marker = "      - name: Materialize the attributed all-formula and quant atlas\n"
          end_marker = "\n      - name: Commit the durable atlas implementation\n"
          start = source.index(start_marker)
          block = source[start:source.index(end_marker, start)]
          run_marker = "        run: |\n"
          body = block[block.index(run_marker) + len(run_marker):]
          lines = []
          for line in body.splitlines():
              if line.startswith("          "):
                  line = line[10:]
              lines.append(line)
          Path("/tmp/materialize-formula-atlas.sh").write_text(
              "\n".join(lines) + "\n", encoding="utf-8"
          )
          PY
          bash /tmp/materialize-formula-atlas.sh

      - name: Commit the durable atlas implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"
          git add atlas scripts/build_formula_atlas.py \
            torch-ext/szl_formulas build/torch-universal/szl_formulas \
            tests/test_formula_quant_atlas.py
          git diff --cached --quiet && { echo "no atlas changes"; exit 1; }
          git commit -s -m "feat(formulas): materialize attributed quant atlas"
          git push origin HEAD:feat/formula-quant-atlas-v1-20260904
