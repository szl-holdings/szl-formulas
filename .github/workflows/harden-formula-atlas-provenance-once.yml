name: Harden formula atlas provenance once

on:
  push:
    branches:
      - feat/formula-quant-atlas-v1-20260904
    paths:
      - .github/workflows/harden-formula-atlas-provenance-once.yml

permissions:
  contents: write

concurrency:
  group: harden-formula-atlas-provenance-once
  cancel-in-progress: false

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact atlas branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/formula-quant-atlas-v1-20260904
          fetch-depth: 0
          persist-credentials: true

      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.13'
          check-latest: false

      - name: Apply and verify exact provenance hardening
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/torch-ext
        run: |
          set -euo pipefail
          python -B -m py_compile tools/harden_formula_atlas_provenance.py
          python -B tools/harden_formula_atlas_provenance.py
          python -B -m py_compile scripts/build_formula_atlas.py tests/test_formula_quant_atlas.py
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_formula_quant_atlas.py --tb=short
          git diff --check HEAD

      - name: Commit only permanent atlas controls
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/harden-formula-atlas-provenance-once.yml tools/harden_formula_atlas_provenance.py
          git diff --check HEAD
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit \
            -m 'fix(formulas): bind atlas corpus to exact archived bytes' \
            -m 'Require both the expected SHA-256 and Git blob identity before atlas construction, prove mutated source is rejected, and lock canonical/package atlas byte parity.' \
            -m 'Signed-off-by: Stephen Lutar <stephenlutar2@gmail.com>'
          git push origin HEAD:feat/formula-quant-atlas-v1-20260904
